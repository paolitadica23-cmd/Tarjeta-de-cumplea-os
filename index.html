<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 40px 30px;
            border: 4px solid #ffffff;
            position: relative;
            overflow: hidden;
        }
        .decor-top {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .card h1 {
            color: #d81b60;
            font-size: 2.4rem;
            margin-bottom: 10px;
            font-weight: 800;
        }
        .card h2 {
            color: #1e88e5;
            font-size: 1.6rem;
            margin-bottom: 25px;
        }
        .bible-box {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-left: 5px solid #fb8c00;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        .bible-verse {
            color: #e65100;
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .bible-ref {
            color: #bf360c;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .custom-message {
            color: #424242;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-celebrate {
            background: linear-gradient(45deg, #ff4081, #7c4dff);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(124, 77, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-celebrate:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 20px rgba(124, 77, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="decor-top">🎉 🎈 🎂</div>
        <h1 id="title">¡Feliz Cumpleaños!</h1>
        <h2 id="name">¡Bendiciones en tu día!</h2>
        
        <div class="bible-box">
            <p class="bible-verse" id="verse">"Que el Señor te conceda lo que tu corazón desea y haga que se cumplan todos tus planes."</p>
            <p class="bible-ref" id="ref">— Salmos 20:4</p>
        </div>

        <p class="custom-message" id="message">
            Que Dios guíe cada uno de tus pasos, te llene de mucha salud, paz, gozo y prosperidad en este nuevo año de vida.
        </p>
        
        <button class="btn-celebrate" onclick="lanzarConfeti()">✨ ¡Llover Bendiciones y Confeti! ✨</button>
    </div>

    <!-- Librería para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const nombre = params.get('nombre');
        const mensaje = params.get('mensaje');

        if (nombre) {
            document.getElementById('name').textContent = `¡Que Dios te bendiga, ${nombre}!`;
        }
        if (mensaje) {
            document.getElementById('message').textContent = mensaje;
        }

        function lanzarConfeti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        window.onload = lanzarConfeti;
    </script>
</body>
</html>
